[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urec-scheduling-experiments"
version = "0.1.0"
description = "Reproducible advisory gym scheduling research laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "simpy>=4.1,<5", "numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "matplotlib>=3.9,<4", "pydantic>=2.9,<3", "pyyaml>=6,<7", "ortools>=9.11,<10",
]

[project.optional-dependencies]
ga = ["pymoo>=0.6,<0.7"]
learning = ["gymnasium>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
gym-sched = "gym_sched.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/gym_sched"]
